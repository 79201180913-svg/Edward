[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edward"
version = "0.4.0"
description = "Edward trading platform"
requires-python = ">=3.14,<3.15"
dependencies = [
    "keyring>=25,<26",
    "openpyxl>=3.1,<4",
]

[project.scripts]
edward = "edward.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
