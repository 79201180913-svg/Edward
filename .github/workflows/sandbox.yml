name: Edward Sandbox

on:
  workflow_dispatch:
    inputs:
      run_smoke_test:
        description: "Run Sandbox connectivity smoke test"
        required: true
        default: true
        type: boolean

jobs:
  sandbox-smoke:
    if: ${{ inputs.run_smoke_test }}
    runs-on: ubuntu-latest
    environment: sandbox
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run Sandbox smoke test
        env:
          TINVEST_API_TOKEN: ${{ secrets.TINVEST_API_TOKEN }}
        run: python -m edward.sandbox_smoke
